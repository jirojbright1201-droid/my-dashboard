<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rent</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/rent-192.png">
<meta name="theme-color" content="#f5f5f7">
<link rel="apple-touch-icon" href="../icons/rent-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../views/rent.css">
<link rel="stylesheet" href="../views/capture.css">
<style>
  :root{ --nav-h: 0px; }
  .scroll{ padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
  .install-bar{ bottom: calc(90px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>

<div class="scroll rnt-shell">
  <div class="app-head">
    <div class="app-head-in">
      <div class="app-title">
        <svg class="spike" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
        <span>Rent</span>
      </div>
      <div class="app-head-slot" id="appHeadSlot"></div>
    </div>
  </div>
  <div class="view active" id="view-root"></div>

  <div class="overlay" id="capOverlay">
    <div class="modal">
      <div class="sheet-handle"></div>
      <div class="modal-head">
        <div><div class="modal-title">Quick capture</div><div class="modal-sub">Saved locally — Jarvis will file it later</div></div>
        <button class="modal-close" id="capClose"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="cap-types" id="capTypes"></div>
        <div class="cap-input-row">
          <input id="capText" placeholder="Jot something... e.g. floor lamp for the corner" autocomplete="off">
          <input id="capAmount" class="cap-amt" placeholder="THB" inputmode="decimal" autocomplete="off">
        </div>
        <button class="cap-add" id="capAdd">Add to inbox</button>
        <div class="cap-list-head" id="capListHead"></div>
        <div class="cap-list" id="capList"></div>
        <div class="cap-actions" id="capActions"></div>
      </div>
    </div>
  </div>
</div>

<div class="install-bar" id="installBar">
  <div class="install-txt">Install as an app — fullscreen, no browser bar</div>
  <button class="install-btn" id="installBtn">Install</button>
  <button class="install-x" id="installX" aria-label="Close">&#10005;</button>
</div>

<script>window.APP_VIEW = 'rent';</script>
<script src="../data/rent-furniture.data.js"></script>
<script src="../data/rent-payments.data.js"></script>
<script src="../data/rent-deposits.data.js"></script>
<script src="../data/rent-calls.data.js"></script>
<script src="../views/rent.js"></script>
<script src="../shared/boot.js"></script>
<script src="../views/capture.js"></script>
</body>
</html>
